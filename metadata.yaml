versions:
  - sha: "9d9352f331d3cf26ecbd88a0afb3b2dc7bdac0f6"
    changeNotes: "Added support for DPI v2.2.1 as the new default Script version for new tags. DEFAULT_VERSION fallback constant bumped from v2.2.0 to v2.2.1 ."
  - sha: "e00792518691d621e2a86090a27fe0e38e1e4bff"
    changeNotes: "Added support for DPI v2.2.0 and Cohort Replay v1.0.4 as the new defaults for new tags. Compatibility hints now remind GTM admins to pair DPI v2.2.0+ with Replay v1.0.4+ for correct mid-session clientId synchronization in hybrid Android/iOS apps. Fixed enableClIdInCookies to always pass under configs.enableClIdInCookies, defaulting to true and honoring opt-out only when the checkbox is explicitly unchecked."
  - sha: "6499b88209cf93f39f10dcdc0bdcf6eefffec142"
    changeNotes: "Added support for DPI v2.1.0 and default-enabled cross-subdomain clientId sharing (enableClIdInCookies). Fixed enableClIdInCookies placement in the init payload so the option is honored at runtime. NOTE: container admins who had previously ticked Enable Client ID in cookies will start writing cookies for the first time after updating and republishing — the option was a silent no-op in earlier template versions. To opt out, untick the checkbox before republishing."
  - sha: "3ff91aa7e921a5d195c7631edab87f88aeaa30a2"
    changeNotes: "Added support for DPI v2.0.2 and Cohort Replay v1.0.3 with bug fixes for cohort replay reliability."
  - sha: "2c92dbd82c6dd07675e63d0651d42987b888bf8a"
    changeNotes: "Initial release. Conviva DPI JS SDK tag: Initialize (with optional Cohort Replay), Set User ID, Track Page View, Track Custom Event, Set/Unset Custom Tags, Track Error, Track Revenue."
